version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
    - module=github.com/erikeah/clavel
  - local: protoc-gen-connect-go
    out: .
    opt:
    - module=github.com/erikeah/clavel
  - local: clavel-gen
    out: .
    opt:
    - name=nixos
    - group=clavel.io
    - version=v1
    - kind=NixosUnit
    - plural=nixosunits
    - spec_message=clavel.units.nixos.v1.NixosUnitSpec